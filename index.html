<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化學結構查詢 App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="化學結構">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2851/2851502.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-lg p-6 mt-4 relative">
        <button onclick="toggleKeySettings()" class="absolute top-4 right-4 text-gray-400 hover:text-blue-600 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-900 flex justify-center items-center gap-2"><span>🧪</span> 有機分子查詢</h1>
            <p class="text-gray-500 text-sm mt-1">Gemini 2.5 Flash 驅動版</p>
        </div>

        <div class="flex gap-2 mb-6">
            <input type="text" id="chemName" placeholder="輸入名稱 (如：甲基環戊烯)" 
                class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm text-base">
            <button onclick="searchCompound()" id="searchBtn" 
                class="bg-blue-600 text-white font-bold px-5 py-3 rounded-xl shadow-md active:scale-95 transition disabled:opacity-50">查詢</button>
        </div>

        <div id="resultArea" class="hidden border-t pt-6">
            <div id="loading" class="text-center py-10">
                <div class="loader"></div>
                <p id="loadingText" class="text-gray-500 text-sm mt-4 italic font-medium">AI 正在搜尋中...</p>
            </div>

            <div id="content" class="hidden text-center animate-fade-in">
                <p id="origInput" class="text-blue-400 text-[10px] font-bold uppercase mb-1 tracking-tighter"></p>
                <h2 id="displayTitle" class="text-xl font-bold text-gray-800 mb-4 tracking-wide uppercase"></h2>
                <div class="bg-gray-50 rounded-2xl p-4 mb-4 border border-gray-100 shadow-inner flex justify-center items-center min-h-[250px]">
                    <img id="molImage" src="" alt="結構圖" class="max-w-full h-auto drop-shadow-sm opacity-0 transition-opacity duration-500" onload="this.classList.remove('opacity-0')">
                </div>
                <div class="grid grid-cols-2 gap-3 text-left">
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                        <span class="text-[9px] text-blue-400 font-bold block mb-1">分子式</span>
                        <span id="formula" class="text-blue-800 font-bold text-sm"></span>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <span class="text-[9px] text-gray-400 font-bold block mb-1">分子量</span>
                        <span id="molWeight" class="text-gray-800 font-bold text-sm"></span>
                    </div>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-xl">
            <p id="errorTitle" class="font-bold text-sm">查詢中斷</p>
            <p id="errorDetail" class="text-xs mt-1 italic"></p>
            <div id="aiResponseBox" class="mt-2 p-2 bg-white bg-opacity-50 rounded border border-red-100 hidden">
                <p class="text-[9px] font-bold text-red-400 uppercase">AI 原始回覆內容：</p>
                <p id="aiRawText" class="text-[10px] font-mono break-all"></p>
            </div>
        </div>

        <div id="keyModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="font-bold text-lg mb-2">🔑 設定 API Key</h3>
                <input type="password" id="apiKeyInput" placeholder="在此輸入您的 API Key" class="w-full border rounded-xl px-4 py-3 mb-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="flex flex-col gap-2">
                    <div class="flex gap-2">
                        <button onclick="saveApiKey()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold transition">儲存</button>
                        <button onclick="toggleKeySettings()" class="flex-1 bg-gray-100 text-gray-600 py-2.5 rounded-xl font-bold transition">取消</button>
                    </div>
                    <button onclick="clearApiKey()" class="w-full bg-red-50 text-red-600 py-2 rounded-xl text-sm font-medium border border-red-100">清除金鑰</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const resArea = document.getElementById('resultArea');
        const loader = document.getElementById('loading');
        const loadText = document.getElementById('loadingText');
        const content = document.getElementById('content');
        const errBox = document.getElementById('errorMessage');
        const aiBox = document.getElementById('aiResponseBox');
        const aiRawText = document.getElementById('aiRawText');
        const searchBtn = document.getElementById('searchBtn');

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            else document.getElementById('keyModal').classList.remove('hidden');
        };

        function toggleKeySettings() { document.getElementById('keyModal').classList.toggle('hidden'); }
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) { localStorage.setItem('gemini_api_key', key); toggleKeySettings(); }
        }
        function clearApiKey() {
            if (confirm("確定清除？")) { localStorage.removeItem('gemini_api_key'); document.getElementById('apiKeyInput').value = ""; }
        }

        async function searchCompound() {
            const name = document.getElementById('chemName').value.trim();
            if (!name) return;
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { toggleKeySettings(); return; }

            searchBtn.disabled = true;
            resArea.classList.remove('hidden');
            loader.classList.remove('hidden');
            content.classList.add('hidden');
            errBox.classList.add('hidden');
            aiBox.classList.add('hidden');
            loadText.innerText = "Step 1: AI 正在辨識結構與異構物...";

            try {
                // 1. AI 轉譯
                let iupacName;
                try {
                    iupacName = await translate(name, apiKey);
                } catch (e) {
                    throw { stage: "AI 判讀階段", message: e.message, raw: e.raw };
                }

                loadText.innerText = `Step 2: 正在 PubChem 搜尋「${iupacName}」...`;

                // 2. 搜尋 CID
                const cid = await getCID(iupacName) || await getCID(name);
                if (!cid) throw { stage: "PubChem 搜尋階段", message: "找不到該化學物質的 ID (CID)。請檢查名稱是否正確。" };

                // 3. 獲取詳情
                const details = await getDetails(cid);
                if (!details) throw { stage: "PubChem 資料抓取階段", message: "無法取得該物質的分子屬性資料。" };

                // 更新 UI
                document.getElementById('origInput').innerText = `搜尋關鍵字: ${name}`;
                document.getElementById('displayTitle').innerText = iupacName;
                document.getElementById('formula').innerText = details.MolecularFormula || "不詳";
                document.getElementById('molWeight').innerText = details.MolecularWeight ? (details.MolecularWeight + " g/mol") : "不詳";
                document.getElementById('molImage').src = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG?width=600&height=600`;

                loader.classList.add('hidden');
                content.classList.remove('hidden');

            } catch (err) {
                loader.classList.add('hidden');
                errBox.classList.remove('hidden');
                document.getElementById('errorTitle').innerText = `錯誤發生於：${err.stage || "系統"}`;
                document.getElementById('errorDetail').innerText = err.message;
                if (err.raw) {
                    aiBox.classList.remove('hidden');
                    aiRawText.innerText = err.raw;
                }
            } finally {
                searchBtn.disabled = false;
            }
        }

        async function translate(q, key) {
            // 使用最新的 Gemini 2.5 Flash
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`;
            
            const prompt = `你是一位有機化學專家。請將使用者輸入的中文或俗名轉換為標準的英文 IUPAC 名稱。
            規則：
            1. 只回傳英文名稱，不可包含任何標點、引號或解釋。
            2. 如果名稱有多種異構物可能（例如「甲基環戊烯」），請自動選擇最穩定或最常見的異構物（例如「1-Methylcyclopentene」）。
            3. 如果完全無法辨識，請回傳 UNKNOWN。
            輸入：${q}`;

            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await resp.json();
            const res = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
            
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            if (!res || res === "UNKNOWN") throw { message: "AI 無法辨識該名稱", raw: res || "無回應" };
            
            // 處理 AI 可能帶出的多餘換行或逗號
            return res.split('\n')[0].replace(/[".]/g, '');
        }

        async function getCID(name) {
            const r = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(name)}/cids/JSON`);
            if (!r.ok) return null;
            const d = await r.json();
            return d.IdentifierList?.CID?.[0] || null;
        }

        async function getDetails(cid) {
            const r = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/MolecularFormula,MolecularWeight/JSON`);
            if (!r.ok) return null;
            const d = await r.json();
            return d.PropertyTable?.Properties?.[0] || null;
        }

        function quickSearch(v) { document.getElementById('chemName').value = v; searchCompound(); }
    </script>
</body>
</html>
