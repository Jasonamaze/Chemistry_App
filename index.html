<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有機化學分子結構查詢</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="化學查詢">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2851/2851502.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen p-3 flex flex-col items-center">

    <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-4 mt-2 relative border border-gray-100">
        
        <!-- 設定按鈕 -->
        <button onclick="toggleKeySettings()" class="absolute top-4 right-4 text-gray-400 hover:text-blue-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800 flex justify-center items-center gap-2">
                <span class="text-2xl">🧪</span> 分子結構與異構物
            </h1>
            <p class="text-slate-400 text-[10px] mt-1 font-medium tracking-wide uppercase">Gemini 2.5 Flash Lite 驅動</p>
        </div>

        <div class="flex flex-nowrap gap-2 mb-4">
            <input type="text" id="chemName" placeholder="輸入名稱或分子式..." 
                class="flex-1 min-w-0 bg-slate-50 border-0 rounded-xl px-3 py-3 focus:ring-2 focus:ring-blue-400 outline-none text-slate-700 shadow-inner text-sm">
            <button onclick="searchCompound()" id="searchBtn" 
                class="w-20 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition-all disabled:opacity-50 text-sm flex-shrink-0">
                查詢
            </button>
        </div>

        <!-- 異構物列表區域 -->
        <div id="isomerSection" class="hidden mb-6">
            <p class="text-[9px] font-black text-slate-400 uppercase mb-2 ml-1 tracking-wider">發現同分異構物：</p>
            <div id="isomerList" class="flex flex-wrap gap-2"></div>
        </div>

        <div id="resultArea" class="hidden border-t border-slate-50 pt-4">
            <div id="loading" class="text-center py-8">
                <div class="loader"></div>
                <p id="loadingText" class="text-slate-400 text-xs mt-3 font-medium italic">分析中...</p>
            </div>

            <div id="content" class="hidden text-center animate-fade-in">
                <p id="origInput" class="text-blue-50 text-[8px] bg-blue-400 inline-block px-2 py-0.5 rounded-full font-bold uppercase tracking-widest mb-2"></p>
                <h2 id="displayTitle" class="text-lg font-black text-slate-800 mb-4 tracking-tight uppercase"></h2>
                
                <div class="bg-slate-50 rounded-2xl p-4 mb-4 border border-slate-100 flex justify-center items-center min-h-[250px] shadow-inner">
                    <img id="molImage" src="" alt="分子圖" class="max-w-full h-auto drop-shadow-lg opacity-0 transition-opacity duration-700" onload="this.classList.remove('opacity-0')">
                </div>

                <div class="grid grid-cols-2 gap-3 text-left">
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                        <span class="text-[8px] text-blue-400 font-black block uppercase mb-0.5">分子式</span>
                        <span id="formula" class="text-blue-900 font-bold text-sm tracking-tight"></span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <span class="text-[8px] text-slate-400 font-black block uppercase mb-0.5">分子量</span>
                        <span id="molWeight" class="text-slate-800 font-bold text-sm tracking-tight"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 錯誤診斷區 -->
        <div id="errorMessage" class="hidden mt-4 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-800 rounded-xl shadow-sm">
            <p id="errorTitle" class="font-black text-[10px] uppercase tracking-wider mb-1"></p>
            <p id="errorDetail" class="text-[10px] leading-relaxed opacity-90"></p>
        </div>

        <!-- 設定彈窗 -->
        <div id="keyModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl">
                <h3 class="font-bold text-lg text-slate-800 mb-2">🔑 API 設定</h3>
                <input type="password" id="apiKeyInput" placeholder="在此輸入您的 API Key" 
                    class="w-full bg-slate-50 border-0 rounded-2xl px-4 py-3 mb-4 text-sm outline-none">
                <div class="flex flex-col gap-2">
                    <div class="flex gap-2">
                        <button onclick="saveApiKey()" class="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-bold active:scale-95 transition">儲存</button>
                        <button onclick="toggleKeySettings()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-2xl font-bold active:scale-95 transition">取消</button>
                    </div>
                    <button onclick="clearApiKey()" class="w-full text-rose-500 py-2 text-[10px] font-bold">清除金鑰</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-6 text-[8px] text-slate-300 font-medium tracking-widest text-center uppercase">
        © 2026 GEMINI 2.5 FLASH LITE & PUBCHEM
    </footer>

    <script>
        const resArea = document.getElementById('resultArea');
        const loader = document.getElementById('loading');
        const loadText = document.getElementById('loadingText');
        const content = document.getElementById('content');
        const errBox = document.getElementById('errorMessage');
        const searchBtn = document.getElementById('searchBtn');
        const isomerSection = document.getElementById('isomerSection');
        const isomerList = document.getElementById('isomerList');

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            else document.getElementById('keyModal').classList.remove('hidden');
        };

        function toggleKeySettings() { document.getElementById('keyModal').classList.toggle('hidden'); }
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) { localStorage.setItem('gemini_api_key', key); toggleKeySettings(); }
        }
        function clearApiKey() {
            if (confirm("確定清除？")) { localStorage.removeItem('gemini_api_key'); document.getElementById('apiKeyInput').value = ""; }
        }

        async function searchCompound(manualName = null) {
            const name = manualName || document.getElementById('chemName').value.trim();
            if (!name) return;
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) { toggleKeySettings(); return; }

            searchBtn.disabled = true;
            resArea.classList.remove('hidden');
            loader.classList.remove('hidden');
            content.classList.add('hidden');
            errBox.classList.add('hidden');
            
            if (!manualName) isomerSection.classList.add('hidden');

            loadText.innerText = "分析中...";

            try {
                const analysis = await analyzeChemistry(name, apiKey);
                
                if (!manualName && analysis.isomers && analysis.isomers.length > 1) {
                    renderIsomers(analysis.isomers);
                }

                let iupacName = analysis.standardName;
                loadText.innerText = `正在檢索：${iupacName}...`;

                let cid = await getCID(iupacName) || await getCID(name);
                
                if (!cid) {
                    let cleanName = iupacName.replace(/poly/i, "").replace(/[()]/g, "").trim();
                    if (cleanName !== iupacName) {
                        loadText.innerText = `檢索單體：${cleanName}...`;
                        cid = await getCID(cleanName);
                        if (cid) iupacName = cleanName;
                    }
                }

                if (!cid) throw { stage: "資料庫階段", message: "找不到該化學物質。請嘗試從下方異構物清單選取。" };

                const details = await getDetails(cid);
                
                document.getElementById('origInput').innerText = manualName ? "指定異構物" : name;
                document.getElementById('displayTitle').innerText = iupacName;
                document.getElementById('formula').innerText = details?.MolecularFormula || "N/A";
                document.getElementById('molWeight').innerText = details?.MolecularWeight ? (details.MolecularWeight + " g/mol") : "N/A";
                document.getElementById('molImage').src = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/PNG?width=800&height=800`;

                loader.classList.add('hidden');
                content.classList.remove('hidden');

            } catch (err) {
                loader.classList.add('hidden');
                errBox.classList.remove('hidden');
                document.getElementById('errorTitle').innerText = `錯誤：${err.stage || "系統"}`;
                document.getElementById('errorDetail').innerText = err.message;
            } finally {
                searchBtn.disabled = false;
            }
        }

        async function analyzeChemistry(q, key) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${key}`;
            
            const prompt = `你是一位有機化學專家。
            任務：分析輸入「${q}」。
            1. 辨識其標準英文 IUPAC 名稱。
            2. 如果輸入是分子式（如 C4H8）或具有多個異構物，請列出其【所有可能】的結構異構物名稱。
               【重要】：必須包含鏈狀 (Open-chain) 與環狀 (Cyclic) 結構。例如 C4H8 必須包含 But-1-ene, But-2-ene, 2-Methylpropene, Cyclobutane, Methylcyclopropane。
            3. 如果輸入是 PMMA, PET, Teflon 等高分子，回傳單體名稱。
            
            請嚴格以 JSON 格式回傳，格式如下：
            {
              "standardName": "一個最主要的標準名稱",
              "isomers": ["名稱1", "名稱2", "名稱3", "名稱4", "名稱5", ...]
            }
            不要回傳任何 JSON 以外的文字。`;

            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!resp.ok) throw new Error(`AI 連線失敗 (HTTP ${resp.status})`);
            const data = await resp.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text?.replace(/```json|```/g, "").trim();
            
            try {
                return JSON.parse(text);
            } catch (e) {
                return { standardName: text.split('\n')[0], isomers: [] };
            }
        }

        function renderIsomers(list) {
            isomerList.innerHTML = "";
            list.forEach(name => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-100 text-slate-600 text-[9px] font-bold px-3 py-1.5 rounded-lg border border-slate-200 active:bg-blue-600 active:text-white transition-all";
                btn.innerText = name;
                btn.onclick = () => searchCompound(name);
                isomerList.appendChild(btn);
            });
            isomerSection.classList.remove('hidden');
        }

        async function getCID(name) {
            try {
                const r = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/${encodeURIComponent(name)}/cids/JSON`);
                if (!r.ok) return null;
                const d = await r.json();
                return d.IdentifierList?.CID?.[0];
            } catch { return null; }
        }

        async function getDetails(cid) {
            try {
                const r = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${cid}/property/MolecularFormula,MolecularWeight/JSON`);
                if (!r.ok) return null;
                const d = await r.json();
                return d.PropertyTable?.Properties?.[0];
            } catch { return null; }
        }
    </script>
</body>
</html>
